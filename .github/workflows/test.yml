name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    # The tests live in tests/ (#89) and import parse / insights / web_push by bare
    # name. `python tests/x.py` puts tests/ on sys.path[0], not the repo root, so the
    # root has to come in through the environment.
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'   # matches the runtime stage of the Dockerfile
          cache: pip
          cache-dependency-path: server/requirements.txt

      # Pinned runtime deps, so CI tests the versions the image actually ships.
      # pytest, httpx and pypdf are test-only: starlette's TestClient needs httpx,
      # and pypdf only ever writes the encrypted fixtures. Neither is a runtime
      # dependency and neither belongs in requirements.txt.
      - run: pip install -r server/requirements.txt pytest httpx pypdf

      # The commands the README tells contributors to run. All pass with an empty
      # cc-statements/ — they work off fixtures, not the real corpus.
      - run: python tests/test_parse_cache.py
      - run: python tests/test_insights.py
      - run: python tests/test_export_data.py
      - run: python tests/test_parse_password.py
      - run: python tests/test_remind_bills.py
      - run: python tests/test_fetch_mail.py
      - run: python tests/test_llm_cats.py
      - run: python tests/test_web_push.py

      # Not a unit test: reads the docs against Dockerfile's COPY list, so a command
      # the docs tell a hoster to run cannot go missing from the image again (0.9.0
      # shipped `python llm_cats.py` for a file that was not in there).
      - run: python tests/test_docs_commands.py

      - run: python -m pytest -q server/

  # parse.py is the most fragile code here and cannot be tested against real
  # statements, which must never reach CI. So this job builds synthetic ones that
  # drive each bank's actual code path, then makes the parser read them back.
  parser:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - run: pip install -r server/requirements.txt pytest httpx pypdf

      - name: Generate synthetic statements
        run: python dev/make_demo_data.py --pdfs

      # Round trip: reconcile() decides what each statement says, the renderer prints
      # it, parse.py re-derives it from the words on the page. Covers per-bank balance
      # labels, multi-card attribution, the CR sign flips, CIMB-i memo exclusion, the
      # SC due-date-before-statement-date trap and the duplicate fingerprint.
      - run: python tests/test_demo_pdfs.py
      - run: python tests/test_parse.py

      # The reconciliation report is the correctness bar the whole repo is judged on,
      # so fail the job if any statement stops reconciling rather than only reading it.
      - name: Reconciliation report must stay all-VERIFIED
        run: |
          python parse.py | tee recon.log
          python - <<'PY'
          import csv, collections, sys
          rows = list(csv.DictReader(open("reconciliation.csv", encoding="utf-8-sig")))
          counts = collections.Counter(r["status"] for r in rows)
          print("statuses:", dict(counts))
          bad = {k: v for k, v in counts.items() if k not in ("VERIFIED", "DUPLICATE")}
          sys.exit(f"statements did not reconcile: {bad}" if bad else 0)
          PY

      - run: python insights.py
      - run: python export_data.py
      - run: python dev/verify_parity.py

      # With statements on disk the server's end-to-end test stops skipping itself:
      # POST a PDF to /ingest, run the real pipeline, assert app.json and /bills.
      - name: Server suite, including the end-to-end ingest
        run: |
          mkdir -p web/build && echo '<!doctype html>' > web/build/index.html
          python -m pytest -q server/

  # The web suite imports web/static/data/app.json directly (src/test-setup.ts and
  # src/lib/data.test.ts), and that file is gitignored — so this job has to build a
  # dataset before it can run anything. Separate from `parser` because it needs the
  # Node toolchain that job has no use for, because the two then run in parallel,
  # and because a red job should name its own half: `parser` red means parse.py
  # regressed, `web` red means the front end did.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # No cache: pip — nothing is installed. make_demo_data.py and export_data.py
          # (via dashboard.py + insights.py) are stdlib-only; pdfplumber is only ever
          # needed to read a PDF, and this job never makes one.

      # Deliberately NOT the --pdfs route the parser job takes. That one renders 85
      # statements and has parse.py read them back, which is the point over there and
      # ~30s of pure waste here — all this job needs is app.json. Without --pdfs the
      # generator writes transactions.csv itself and export_data.py turns it into
      # app.json, same 596 transactions in 0.02s. (insights.py is not needed in
      # between; export_data.py imports it.)
      - name: Synthetic dataset for the web suite
        run: |
          python dev/make_demo_data.py
          python export_data.py

      - uses: actions/setup-node@v7
        with:
          node-version: '22'   # matches the web build stage of the Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # svelte-check first: it fails on a missing app.json with a clearer message than
      # vitest's transform stack, so a broken dataset reads as a broken dataset.
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web
