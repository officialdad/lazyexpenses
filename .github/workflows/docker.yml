name: build-image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # #99: arm64 is emulated on an amd64 runner - needed both to BUILD the arm64
      # image and to `docker run` it in the version gate below.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # #99: a single always-on container parsing PDFs is a Pi workload.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # #62: the only place the version is injected. Both stages read it (see Dockerfile).
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # #62: the half-applied-bump check, limited to what this repo can see - that the
      # image really carries the version it was tagged with, in BOTH stages (a missing
      # per-stage ARG is the easy way to get this wrong). Tag <-> deployed-digest agreement
      # is NOT checkable here: the manifest lives in a separate infrastructure repo.
      # The build above never loads into the daemon (push, no `load:`), so this PULLS the
      # tag back out of ghcr.io - which is why it kept working when the build went
      # multi-arch. #99: --platform makes the pick explicit instead of "whatever the runner
      # is", and the loop runs the arm64 variant too, so `exec format error` - the bug that
      # opened #99 - fails the tag instead of reaching a Pi.
      - name: image reports the version it was tagged with
        env:
          V: ${{ steps.meta.outputs.version }}
        run: |
          for p in linux/amd64 linux/arm64; do
            docker run --rm --platform "$p" -e V="$V" "ghcr.io/${{ github.repository }}/app:$V" \
              sh -c '[ "$APP_VERSION" = "$V" ] && grep -rq "$V" web_build/_app/'
          done

  # The release itself, kept behind `needs: build` so a tag whose image reports the wrong
  # version publishes nothing. Notes are generated from the PRs merged since the previous
  # tag; .github/release-header.md is PREPENDED above them as the fixed part a changelog
  # cannot know — how to run it and what the one required setting is.
  release:
    needs: build
    # workflow_dispatch fires on a branch, where there is no tag to release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # The header names a pullable tag, so the bare version is substituted in.
          # Idempotent on purpose. A re-run of a tag build, or a tag whose release was
          # written by hand first, must not fail the whole run - the image is already
          # pushed by then. An existing release also keeps its body: whoever wrote it
          # knew more than --generate-notes does.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, leaving its notes alone"
            exit 0
          fi
          # The header names a pullable tag, so the bare version is substituted in.
          sed "s/VERSION/${TAG#v}/" .github/release-header.md > /tmp/notes.md
          gh release create "$TAG" \
            --title "lazyexpenses ${TAG#v}" \
            --verify-tag \
            --generate-notes \
            --notes-file /tmp/notes.md
