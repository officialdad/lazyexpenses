<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/pwa-192x192.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

		<!-- Link previews. These are for the public demo, so the URLs are the demo's and
		     absolute: an unfurl bot resolves og:image against nothing, and %sveltekit.assets%
		     is a relative path here. A self-hosted instance serves these too and points at
		     the demo's card, which costs it nothing — it sits behind a password on a private
		     network, so no crawler ever reads them. The image is web/static/og.png, the same
		     file to upload under the repository's Settings > Social preview, which GitHub
		     takes by upload only and never reads from a path. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="lazyexpenses" />
		<meta property="og:title" content="lazyexpenses" />
		<meta property="og:description" content="Reads the locked statement PDFs your Malaysian banks email you and turns them into a dashboard of what you actually spend. Runs on your own machine." />
		<meta property="og:url" content="https://officialdad.github.io/lazyexpenses/" />
		<meta property="og:image" content="https://officialdad.github.io/lazyexpenses/og.png" />
		<meta property="og:image:width" content="1280" />
		<meta property="og:image:height" content="640" />
		<meta property="og:image:alt" content="lazyexpenses: what you spend, by category, a leak finder and bills due" />
		<meta name="twitter:card" content="summary_large_image" />
		<!-- ponytail: register the SW by hand. @vite-pwa/sveltekit generates sw.js +
		     manifest.webmanifest but its auto-inject doesn't land in the static build
		     output (Vite 8 + SvelteKit), so nothing referenced them → no manifest, no
		     SW → Chrome offered only a "Add to Home screen" shortcut, never Install,
		     and the offline cache never populated.

		     #67: registerType:'autoUpdate' only configures the generated registerSW.js,
		     which nothing loads either — so nothing ever reloaded. sw.js really does
		     skipWaiting+clientsClaim, so a new worker activates and claims this client
		     (→ controllerchange), but the already-loaded document keeps running its old
		     assets. Hence the reloader below. It PROMPTS rather than reloading itself:
		     /settings has forms, and yanking the page mid-password is worse than a
		     stale shell. Inline, with inline styles, on purpose — it has to work when
		     the Svelte shell is the stale thing. -->
		<script>
			function swUpdateBanner() {
				if (document.getElementById('sw-update')) return;
				var d = document.createElement('div');
				d.id = 'sw-update';
				d.setAttribute('role', 'status');
				d.style.cssText =
					'position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);z-index:9999;' +
					'display:flex;gap:.75rem;align-items:center;max-width:calc(100vw - 2rem);' +
					'background:#111827;color:#fff;border:1px solid #4b5563;border-radius:.5rem;' +
					'padding:.6rem .75rem;box-shadow:0 4px 20px rgba(0,0,0,.5);' +
					'font:500 14px/1.3 system-ui,sans-serif';
				var t = document.createElement('span');
				t.textContent = 'New version available';
				var b = document.createElement('button');
				b.type = 'button';
				b.textContent = 'Reload';
				b.style.cssText =
					'flex:none;background:#fff;color:#111827;border:0;border-radius:.375rem;' +
					'padding:.35rem .7rem;cursor:pointer;font:600 14px system-ui,sans-serif';
				b.addEventListener('click', function () {
					location.reload();
				});
				d.append(t, b);
				document.body.append(d);
			}
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', function () {
					// Null on a first-ever install, where clientsClaim fires controllerchange
					// with no old assets to replace. Prompting then is noise, reloading a loop.
					// Promoted rather than frozen: once that first claim is seen, any further
					// controllerchange in this document IS a new deploy, even though the flag
					// started false — a tab left open since its first visit still gets told.
					var hadController = !!navigator.serviceWorker.controller;
					// ponytail: absolute, so this only registers when the app is served at /.
					// The GitHub Pages demo (base=/lazyexpenses) 404s here and the .catch below
					// swallows it — the demo loses offline and Install, which a demo does not
					// need. Make it base-aware if the demo ever has to be installable.
					navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function (reg) {
						navigator.serviceWorker.addEventListener('controllerchange', function () {
							if (hadController) swUpdateBanner();
							else hadController = true;
						});
						// An installed PWA resumed from the background may never navigate, so
						// nothing re-fetches sw.js. Poll, and check on resume; the 60s floor
						// keeps a tab-switcher from hammering it.
						var last = 0;
						var check = function () {
							if (Date.now() - last < 60000) return;
							last = Date.now();
							reg.update().catch(function () {});
						};
						setInterval(check, 3600000);
						document.addEventListener('visibilitychange', function () {
							if (document.visibilityState === 'visible') check();
						});
					})
					// Insecure context (plain-HTTP LAN IP) rejects; not an error worth logging.
					.catch(function () {});
				});
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
