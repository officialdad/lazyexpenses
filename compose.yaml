# The whole pipeline in one command:
#
#   cp .env.example .env    # fill in what you have
#   docker compose up -d
#
# `app` is the web app, the API and the bill reminders (the reminders run inside the
# server process, so there is no third service here). `fetch` polls your mailbox and
# posts new statements to it. Both are the same published image; nothing is built.
services:
  app:
    image: ghcr.io/officialdad/lazyexpenses/app:latest
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped

  fetch:
    image: ghcr.io/officialdad/lazyexpenses/app:latest
    env_file: .env
    environment:
      # over the compose network, not the published port
      INGEST_URL: http://app:8000/ingest
    # ponytail: a sleep loop is the whole scheduler. It survives restarts, needs no cron
    # in the image and no host crontab; swap in a real scheduler if you ever need
    # calendar-precise times. Exits quietly when the GMAIL_* vars are unset, so leaving
    # the mail half unconfigured costs you one log line an hour.
    command: sh -c 'while :; do python fetch_mail.py; sleep "$${FETCH_EVERY:-3600}"; done'
    depends_on:
      - app
    restart: unless-stopped

# Named volume, not a bind mount: the statements, the parse cache and app.json live
# here and must outlive the container. `docker compose down` keeps it; `down -v` does not.
volumes:
  data:
