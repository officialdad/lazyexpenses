# The whole pipeline in one command:
#
#   cp .env.example .env    # fill in what you have
#   docker compose up -d
#
# One service, because the server is the only long-running thing here and it already
# knows where the data lives: it serves the web app and the API, fetches your statement
# mail on a timer, and sends the bill reminders. Nothing is built - this is the image
# published on every release.
services:
  app:
    image: ghcr.io/officialdad/lazyexpenses/app:latest
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped

# Named volume, not a bind mount: the statements, the parse cache and app.json live
# here and must outlive the container. `docker compose down` keeps it; `down -v` does not.
volumes:
  data:
